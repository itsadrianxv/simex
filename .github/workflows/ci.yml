name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libssl-dev nlohmann-json3-dev ${{ matrix.compiler == 'clang' && 'clang' || '' }}

      - name: Configure
        run: cmake --preset ci-${{ matrix.compiler }}

      - name: Build
        run: cmake --build --preset ci-${{ matrix.compiler }}

      - name: Test
        run: ctest --preset test-ci-${{ matrix.compiler }}

  sanitizer:
    name: clang-sanitizer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build libssl-dev nlohmann-json3-dev

      - name: Configure
        run: cmake --preset sanitizer

      - name: Build
        run: cmake --build --preset sanitizer

      - name: Test
        run: ctest --preset test-sanitizer
